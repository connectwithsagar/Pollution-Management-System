version: "3.9"

services:
  aethergrid:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - OPENAQ_API_KEY=${OPENAQ_API_KEY:-}
      - JWT_SECRET=${JWT_SECRET:-change-me-in-production}
      - IOT_INGEST_KEY=${IOT_INGEST_KEY:-}
      - REFRESH_INTERVAL_MS=${REFRESH_INTERVAL_MS:-300000}
    volumes:
      - aethergrid_data:/app/.data
      - aethergrid_artifacts:/app/ai/artifacts
    restart: unless-stopped

volumes:
  aethergrid_data:
  aethergrid_artifacts:
